<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Catalog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Coffee Catalog</h1>
        <button id="cart-button" aria-label="View cart" title="View cart">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count" class="badge">0</span>
        </button>
    </header>

    <main id="catalog" aria-live="polite">
        <!-- Catalog items will be injected here -->
    </main>

    <section id="cart-modal" class="hidden" aria-modal="true" role="dialog" aria-labelledby="cart-title">
        <div class="cart-content">
            <h2 id="cart-title">Your Cart</h2>
            <button id="close-cart" aria-label="Close cart">×</button>
            <ul id="cart-items" role="list">
                <!-- Cart items will be injected here -->
            </ul>
            <p id="cart-total">Total: $0.00</p>
            <button id="clear-cart">Clear Cart</button>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
