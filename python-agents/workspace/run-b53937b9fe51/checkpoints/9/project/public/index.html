<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Catalogue</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header>
    <h1>Coffee Catalogue</h1>
    <button id="view-cart-btn" class="cart-btn"><i class="fas fa-shopping-cart"></i> View Cart (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <section id="product-list" class="grid"></section>
    <section id="cart" class="cart hidden">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
      <button id="close-cart-btn" class="close-btn"><i class="fas fa-times"></i> Close</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
